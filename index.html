<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tempo 3D Brasil</title>
  <link rel="stylesheet" href="./src/ui/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading">carregando previsão…</div>
  <div id="fatal" hidden></div>
  <div id="badge" hidden></div>
  <div id="legend" hidden></div>
  <div id="search" role="search" hidden></div>
  <button id="region-back" type="button" hidden>← Brasil</button>
  <div id="region-msg" role="status" hidden></div>
  <button id="debug-toggle" type="button" aria-label="Menu de debug" aria-expanded="false" aria-controls="debug" title="Debug">⚙</button>
  <div id="debug" hidden></div>
  <div id="tooltip" hidden></div>
  <aside id="city" aria-label="Município selecionado" hidden></aside>
  <footer id="timeline" hidden></footer>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
